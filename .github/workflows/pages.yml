name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pinned so the checks below run on a known Python (3.12); ubuntu-latest moves
    # to Ubuntu 26 in a rollout starting 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Links, anchors, images, sitemap, prices, FAQ answers, colour tokens, asset
      # stamps, scripts and formatting. A failure stops the deploy; run it locally
      # before pushing.
      - name: Check site
        run: python3 scripts/check_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
